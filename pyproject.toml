[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cline-hooks"
version = "1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bashlex",
    "gitpython",
]

[project.scripts]
cline-hook = "cline_hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cline_hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = ["--color=yes"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.paths]
source = [
    "src/cline_hooks",
    ".venv/**/cline_hooks",
]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "bashlex.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
extend-exclude = [".venv"]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]
test = [
    "coverage>=7.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14",
]
lint = [
    "ruff>=0.11.0",
]
typecheck = [
    "mypy>=1.15",
]
