[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cline-hooks"
version = "1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bashlex",
    "gitpython",
    "platformdirs",
    "pydantic>=2",
]

[project.scripts]
cline-hook = "cline_hooks._main:main"

[project.entry-points."llm_prompts"]
hooks = "cline_hooks"

[tool.hatch.build.targets.wheel]
packages = ["src/cline_hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = ["--color=yes"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.paths]
source = [
    "src/cline_hooks",
    ".venv/**/cline_hooks",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend = ".venv/.fayers-configs/ruff/pyproject.toml"

[tool.ruff.lint]
extend-ignore = [
    "unused-method-argument",       # unused arg - required to conform to a Protocol/ABC method signature
    "unused-class-method-argument", # same, for classmethods
    "too-many-return-statements",   # plugin on_hook() dispatchers are guard-clause chains by design
]

[tool.ruff.lint.per-file-ignores]
"src/cline_hooks/core/payload.py" = [
    "mixed-case-variable-in-class-scope", # camelCase fields mirror the external JSON payload keys
    "any-type",                           # pydantic "before" validators receive raw, untyped JSON
]
"src/cline_hooks/core/parameters.py" = [
    "any-type", # pydantic "before" validators receive raw, untyped JSON
]
"src/cline_hooks/frontends/*/models.py" = [
    "mixed-case-variable-in-class-scope", # camelCase fields mirror the external JSON payload keys
]
"tests/**" = [
    "pytest-fixture-autouse", # autouse fixtures are the standard way to isolate test state here
    "hardcoded-temp-file",    # /tmp paths in tests are fixture data, never actually written to
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "bashlex.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_prompts.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]
test = [
    "coverage>=7.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14",
]
lint = [
    "ruff>=0.11.0",
    "fayers-configs",
]
typecheck = [
    "mypy>=1.15",
]

[tool.uv.sources]
fayers-configs = { git = "https://github.com/alexfayers/fayers-configs" }
