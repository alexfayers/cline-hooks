name: Project automation

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed, synchronize, labeled, unlabeled, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [Dependencies, CI]
    types: [completed]

concurrency:
  group: project-automation-${{ github.event_name == 'workflow_run' && format('run-{0}', github.event.workflow_run.head_sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  automate:
    permissions:
      checks: read
      pull-requests: write
      statuses: write
    uses: alexfayers/llm-prompts/.github/workflows/pr-automation.yml@main
    secrets:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
