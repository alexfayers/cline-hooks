name: Dependencies

on:
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [dependencies-recheck]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      issues: write
      statuses: write
      pull-requests: write
    steps:
      - uses: alexfayers/llm-prompts/.github/actions/check-dependencies@main
        with:
          projects-token: ${{ secrets.PROJECTS_TOKEN }}
