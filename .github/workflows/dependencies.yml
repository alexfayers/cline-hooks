name: Dependencies

on:
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened]
  issues:
    types: [closed, reopened]
  workflow_run:
    workflows: [PR review]
    types: [completed]
  workflow_dispatch:
  repository_dispatch:
    types: [dependencies-recheck]

jobs:
  check-dependencies:
    permissions:
      checks: read
      issues: write
      statuses: write
      pull-requests: write
    uses: alexfayers/llm-prompts/.github/workflows/dependencies.yml@main
    secrets:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      CI_BOT_ID: ${{ secrets.CI_BOT_ID }}
      CI_BOT_PRIVATE_KEY: ${{ secrets.CI_BOT_PRIVATE_KEY }}
