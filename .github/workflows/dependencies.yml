name: Dependencies

on:
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      statuses: write
      pull-requests: read
    steps:
      - uses: alexfayers/llm-prompts/.github/actions/check-dependencies@main

  rerun-dependents:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - run: |
          for repo in alexfayers/llm-prompts alexfayers/cline-hooks alexfayers/mcp-memory; do
            for sha in $(gh pr list --repo "$repo" --state open --limit 100 --json headRefOid,body | jq -r --arg url "$PR_URL" '.[] | select(any((.body // "") | scan("(?i)(?:depends on|blocked by)\\s+(\\S+)"); .[0] == $url)) | .headRefOid'); do
              gh run list --repo "$repo" --workflow dependencies.yml --event pull_request_target --commit "$sha" --limit 1 --json databaseId,conclusion --jq '.[] | select(.conclusion == "failure") | .databaseId' | xargs -r -n1 gh run rerun --repo "$repo" --failed
            done
          done
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
